<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BARSOI PUBLIC SCHOOL - Marks Entry Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root {
      --school-green: #1b4332;
      --school-title: #2d6a4f;
      --banner-dark: #2c3e50;
    }
    
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #eef2f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body { 
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
    }

    .main-card { 
      width: 100%;
      max-width: 900px;
      height: 100vh;
      border: none;
      border-radius: 0; 
      background: #ffffff; 
      display: flex;
      flex-direction: column;
      overflow: visible !important;
      margin: auto;
    }

    @media (min-width: 768px) {
      body { padding: 15px; align-items: center; }
      .main-card {
        height: 95vh;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      }
    }
    
    .header-container { 
      padding: 12px 10px 8px 10px; 
      background: #fff; 
      text-align: center;
      flex-shrink: 0;
    }

    .school-title { 
      color: var(--school-title); 
      font-weight: 800; 
      font-size: clamp(1.2rem, 4.5vw, 1.8rem); 
      letter-spacing: 0.5px; 
      margin-bottom: 2px; 
      line-height: 1.1;
      text-transform: uppercase;
    }

    .trust-title { 
      font-weight: 700; 
      font-size: clamp(0.75rem, 2.5vw, 0.95rem); 
      color: var(--school-green); 
      margin-bottom: 2px; 
      text-transform: uppercase; 
    }

    .school-details { 
      font-size: clamp(0.68rem, 2vw, 0.8rem); 
      color: #333333; 
      font-weight: 600; 
      line-height: 1.3; 
    }

    .school-email { color: #0d6efd; font-weight: 700; }
    
    .banner-strip { 
      background: var(--banner-dark); 
      color: #ffffff; 
      text-align: center; 
      padding: 6px 10px; 
      font-weight: 700; 
      font-size: clamp(0.85rem, 2.8vw, 1.05rem); 
      letter-spacing: 1px; 
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .form-section { 
      padding: 10px 12px; 
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .controls-row { flex-shrink: 0; margin-bottom: 8px; }
    .form-label { margin-bottom: 2px; font-size: 0.85rem; }

    .form-select {
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 16px !important;
      border: 1.5px solid #cbd5e1;
    }

    #marksForm {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .status-bar { flex-shrink: 0; margin-bottom: 6px; }

    .table-responsive { 
      flex-grow: 1;
      overflow-y: auto; 
      border: 1px solid #dee2e6; 
      border-radius: 8px; 
      margin-bottom: 8px;
    }

    .sticky-header th { 
      position: sticky; 
      top: 0; 
      background-color: #0d6efd; 
      color: white; 
      z-index: 2; 
      text-align: left; 
      padding: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .mark-input { 
      width: 80px; 
      text-align: center; 
      font-weight: 700; 
      font-size: 1.05rem !important; 
      padding: 4px 6px;
      border-radius: 6px;
    }

    .submit-container { flex-shrink: 0; padding-top: 2px; }

    .btn-submit {
      background-color: #0d6efd;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      padding: 10px 20px;
      font-size: 1rem;
      width: 100%;
    }

    #saveIndicator {
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="main-card">
  
  <!-- Header Section -->
  <div class="header-container">
    <h1 class="school-title">BARSOI PUBLIC SCHOOL</h1>
    <div class="trust-title">ZAHIR EDUCATIONAL & WELFARE TRUST</div>
    <div class="school-details">
      BARSOI, BARSOI, KATIHAR, BIHAR 855102 &nbsp;|&nbsp; UDISE :- 10101119902<br>
      <span class="school-email">Email-barsoipublicschool125@gmail.com</span>
    </div>
  </div>

  <!-- Banner Bar -->
  <div class="banner-strip">
    HALF YEARLY EXAMINATION : 2026-27
  </div>

  <!-- Form Section -->
  <div class="form-section">
    <div class="row g-2 controls-row">
      <div class="col-6">
        <label for="classSelect" class="form-label fw-bold text-secondary">Select Class:</label>
        <select id="classSelect" class="form-select fw-semibold" onchange="onClassChange()">
          <option value="">-- Class --</option>
        </select>
      </div>

      <div class="col-6">
        <label for="subjectSelect" class="form-label fw-bold text-secondary">Select Subject:</label>
        <select id="subjectSelect" class="form-select fw-semibold" onchange="loadStudents()" disabled>
          <option value="">-- Subject --</option>
        </select>
      </div>
    </div>

    <!-- Students Marks Table Form -->
    <form id="marksForm" class="d-none" onsubmit="submitForm(event)">
      <div class="d-flex justify-content-between align-items-center status-bar">
        <span class="text-muted small fw-bold">SUBJECT-WISE MARKS ENTRY</span>
        <span id="saveIndicator" class="badge bg-secondary">Idle</span>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="sticky-header">
            <tr>
              <th style="width: 20%;">Roll No</th>
              <th style="width: 55%;">Student Name</th>
              <th style="width: 25%;" class="text-center">Marks Input</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>

      <!-- Submit Button -->
      <div class="submit-container">
        <button type="submit" id="submitBtn" class="btn btn-primary btn-submit">Submit Marks</button>
      </div>
    </form>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykk1fQQ4X8uynuDFoqa7ZXq3DkSmhzcAUc-SFSjXhDIlzZSj2eVfoxRMEQ4ZtVbLNXAg/exec";
  
  const DEFAULT_CLASSES = ["Nursery", "LKG", "UKG", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"];
  const DEFAULT_SUBJECTS = ["English", "Urdu", "Hindi", "Maths", "Science", "S.Science", "G.K", "Computer", "Drawing"];

  let autoSaveTimer = null;

  // 1. INSTANT CLASS DROPDOWN
  window.onload = function() {
    const cachedClasses = localStorage.getItem("bps_cached_classes");
    const classesToRender = cachedClasses ? JSON.parse(cachedClasses) : DEFAULT_CLASSES;
    
    renderClassDropdown(classesToRender);

    fetch(`${SCRIPT_URL}?action=getClasses`)
      .then(res => res.json())
      .then(data => {
        if(data.status === "success" && data.classes.length > 0) {
          localStorage.setItem("bps_cached_classes", JSON.stringify(data.classes));
          renderClassDropdown(data.classes);
        }
      })
      .catch(err => console.log("Classes sync skipped"));
  };

  function renderClassDropdown(classes) {
    const classSelect = document.getElementById("classSelect");
    const currentValue = classSelect.value;
    classSelect.innerHTML = '<option value="">-- Class --</option>';
    
    classes.forEach(cls => {
      let opt = document.createElement("option");
      opt.value = cls;
      opt.textContent = cls;
      if(cls === currentValue) opt.selected = true;
      classSelect.appendChild(opt);
    });
  }

  // 2. INSTANT SUBJECT DROPDOWN
  function onClassChange() {
    const className = document.getElementById("classSelect").value;
    const subjectSelect = document.getElementById("subjectSelect");
    const marksForm = document.getElementById("marksForm");
    
    subjectSelect.innerHTML = '<option value="">-- Subject --</option>';
    subjectSelect.disabled = true;
    marksForm.classList.add("d-none");

    if(!className) return;

    const cacheKey = "bps_subjects_" + className;
    const cachedSubjects = localStorage.getItem(cacheKey);
    const subjectsToRender = cachedSubjects ? JSON.parse(cachedSubjects) : DEFAULT_SUBJECTS;

    renderSubjectDropdown(subjectsToRender);

    fetch(`${SCRIPT_URL}?action=getSubjects&className=${encodeURIComponent(className)}`)
      .then(res => res.json())
      .then(data => {
        if(data.status === "success" && data.subjects.length > 0) {
          localStorage.setItem(cacheKey, JSON.stringify(data.subjects));
          renderSubjectDropdown(data.subjects);
        }
      })
      .catch(err => console.log("Subjects sync skipped"));
  }

  function renderSubjectDropdown(subjects) {
    const subjectSelect = document.getElementById("subjectSelect");
    const currentValue = subjectSelect.value;
    subjectSelect.innerHTML = '<option value="">-- Subject --</option>';
    
    subjects.forEach(sub => {
      let opt = document.createElement("option");
      opt.value = sub;
      opt.textContent = sub;
      if(sub === currentValue) opt.selected = true;
      subjectSelect.appendChild(opt);
    });
    subjectSelect.disabled = false;
  }

  // 3. LOAD STUDENTS (With SweetAlert Loader)
  function loadStudents() {
    const className = document.getElementById("classSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    const marksForm = document.getElementById("marksForm");
    const tbody = document.getElementById("studentTableBody");
    const badge = document.getElementById("saveIndicator");

    if(!className || !subject) {
      marksForm.classList.add("d-none");
      return;
    }

    // Show Loading Alert
    Swal.fire({
      title: 'Loading Student List...',
      text: `Fetching records for Class ${className} (${subject})`,
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    tbody.innerHTML = "";

    fetch(`${SCRIPT_URL}?action=getStudents&className=${encodeURIComponent(className)}&subject=${encodeURIComponent(subject)}`)
      .then(res => res.json())
      .then(data => {
        Swal.close();
        if(data.status === "success") {
          if(data.students.length === 0) {
            Swal.fire({
              icon: 'warning',
              title: 'No Data Found',
              text: `Class ${className} No student record.`
            });
            return;
          }

          renderStudentRows(data.students);
          marksForm.classList.remove("d-none");
          badge.className = "badge bg-success";
          badge.textContent = "Ready";
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: data.message || 'There is a problem to load Data.'
          });
        }
      })
      .catch(err => {
        Swal.close();
        Swal.fire({
          icon: 'error',
          title: 'Connection Error',
          text: 'Could not fetch data. Check Connection.'
        });
      });
  }

  function renderStudentRows(students) {
    const tbody = document.getElementById("studentTableBody");
    tbody.innerHTML = "";
    students.forEach(std => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="fw-bold text-secondary">${std.rollNo}</td>
        <td class="fw-semibold">${std.name}</td>
        <td class="text-center">
          <input type="number" 
                 class="form-control form-control-sm mark-input mx-auto" 
                 data-row="${std.rowNum}" 
                 value="${std.mark}" 
                 min="0" max="100" 
                 placeholder="0"
                 oninput="triggerAutoSave()"
                 onchange="triggerAutoSaveImmediate()">
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 4. AUTO-SAVE HANDLERS
  function triggerAutoSave() {
    const badge = document.getElementById("saveIndicator");
    badge.className = "badge bg-warning text-dark";
    badge.textContent = "Typing...";
    
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => {
      saveMarksToSheet(false);
    }, 1000);
  }

  function triggerAutoSaveImmediate() {
    clearTimeout(autoSaveTimer);
    saveMarksToSheet(false);
  }

  // 5. SAVE MARKS TO SHEET
  function saveMarksToSheet(isFinalSubmit = false) {
    const className = document.getElementById("classSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    const badge = document.getElementById("saveIndicator");

    if(!className || !subject) return;

    badge.className = "badge bg-info text-dark";
    badge.textContent = "Saving...";

    const markInputs = document.querySelectorAll(".mark-input");
    const marksData = [];

    markInputs.forEach(input => {
      marksData.push({
        rowNum: input.getAttribute("data-row"),
        mark: input.value
      });
    });

    if(isFinalSubmit) {
      Swal.fire({
        title: 'Submitting Marks...',
        text: 'Please wait.........',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });
    }

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        className: className,
        subject: subject,
        marksData: marksData
      })
    })
    .then(res => res.json())
    .then(res => {
      if(res.status === "success") {
        badge.className = "badge bg-success";
        badge.textContent = "Auto-Saved";

        if(isFinalSubmit) {
          Swal.fire({
            icon: 'success',
            title: 'Submitted Successfully!',
            text: `Class ${className} (${subject}) marks updated!`,
            timer: 2000,
            showConfirmButton: false
          });
        }
      } else {
        badge.className = "badge bg-danger";
        badge.textContent = "Save Failed";
        if(isFinalSubmit) {
          Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        }
      }
    })
    .catch(err => {
      badge.className = "badge bg-danger";
      badge.textContent = "Error";
      if(isFinalSubmit) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: ' Failed to update .'
        });
      }
    });
  }

  // 6. FORM SUBMIT
  function submitForm(e) {
    e.preventDefault();
    clearTimeout(autoSaveTimer);
    saveMarksToSheet(true);
  }
</script>

</body>
</html>
